<!DOCTYPE html>
<html>
<head>
  <style>
    @font-face {
      font-family: 'Geist';
      src: url('/fonts/s/geist/v5/gyBhhwUxId8gMGYQMKR3pzfaWI_RNeQImpna.woff2') format('woff2');
      font-weight: 600;
      font-style: normal;
    }
    .test {
      font-family: 'Geist', sans-serif;
      font-size: 140.4978465979963px;
      font-weight: 600;
      letter-spacing: -0.05em;
      line-height: 82%;
      text-transform: uppercase;
      white-space: pre;
      display: inline-block;
    }
  </style>
</head>
<body>
  <div id="mattis" class="test">Mattis</div>
  <div id="ultimate" class="test">Ultimate</div>
  <div id="out"></div>
  <script>
    document.fonts.ready.then(() => {
      const m = document.getElementById('mattis').getBoundingClientRect();
      const u = document.getElementById('ultimate').getBoundingClientRect();
      document.getElementById('out').innerText = 'MEASURE_RESULT: mattis=' + m.width + 'x' + m.height + ' | ultimate=' + u.width + 'x' + u.height;
    });
  </script>
</body>
</html>
